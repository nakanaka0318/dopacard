<script>
'use strict';
/* ===== 共通ユーティリティ ===== */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

// 演出の速度・ヘッドレス（テスト用）・エフェクト軽減
const Time = { speed: 1, headless: false, reduced: false };

function wait(ms) {
  if (Time.headless || ms <= 0) return Promise.resolve();
  return new Promise(r => setTimeout(r, ms / Time.speed));
}
// 演出速度に関係なく待つ（UI用）
function waitReal(ms) {
  if (Time.headless || ms <= 0) return Promise.resolve();
  return new Promise(r => setTimeout(r, ms));
}
function nextFrame() {
  if (Time.headless) return Promise.resolve();
  return new Promise(r => requestAnimationFrame(() => r()));
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const R = {
  next: Math.random,
  int(a, b) { return a + Math.floor(this.next() * (b - a + 1)); },
  pick(arr) { return arr.length ? arr[Math.floor(this.next() * arr.length)] : undefined; },
  chance(p) { return this.next() < p; },
  shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(this.next() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  },
  // entries: [[value, weight], ...]
  weighted(entries, rnd = this.next) {
    const total = entries.reduce((s, e) => s + e[1], 0);
    let x = rnd() * total;
    for (const [v, w] of entries) { if ((x -= w) < 0) return v; }
    return entries[entries.length - 1][0];
  },
};

function seeded(seed) {
  const f = mulberry32(seed);
  return {
    next: f,
    int(a, b) { return a + Math.floor(f() * (b - a + 1)); },
    pick(arr) { return arr[Math.floor(f() * arr.length)]; },
    shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    },
    weighted(entries) { return R.weighted(entries, f); },
  };
}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmt(n) { return Math.round(n).toLocaleString('ja-JP'); }

function todayStr(d = new Date()) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// localStorage は使えない環境があるので必ず try/catch
const Store = {
  get(key, def) {
    try {
      const v = localStorage.getItem(key);
      return v == null ? def : JSON.parse(v);
    } catch (e) { return def; }
  },
  set(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { return false; }
  },
  del(key) { try { localStorage.removeItem(key); } catch (e) { /* noop */ } },
};

// 簡易DOMビルダ
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

function centerOf(elm) {
  if (!elm || !elm.getBoundingClientRect) return { x: innerWidth / 2, y: innerHeight / 2, w: 0, h: 0 };
  const r = elm.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height };
}

function vibrate(p) {
  try { if (window.Settings && !Settings.vibrate) return; navigator.vibrate && navigator.vibrate(p); } catch (e) { /* noop */ }
}

// アニメーション（Web Animations API）を Promise で
function animate(elm, frames, opts) {
  if (!elm || Time.headless || !elm.animate) return Promise.resolve();
  const o = Object.assign({}, typeof opts === 'number' ? { duration: opts } : opts);
  if (!o.realtime) o.duration = (o.duration || 300) / Time.speed;
  delete o.realtime;
  try {
    const a = elm.animate(frames, o);
    return a.finished.catch(() => {});
  } catch (e) { return Promise.resolve(); }
}

<script>
'use strict';
/* ===== サウンド：効果音もBGMもすべてWebAudioで合成 ===== */

const Sound = (() => {
  let ctx = null, master, comp, sfxBus, bgmBus, noiseBuf;
  const vol = { bgm: 0.5, sfx: 0.8 };
  const last = {};

  function init() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try {
      ctx = new AC();
    } catch (e) { return false; }
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 4;
    comp.attack.value = 0.003; comp.release.value = 0.18;
    master = ctx.createGain(); master.gain.value = 0.9;
    sfxBus = ctx.createGain(); sfxBus.gain.value = vol.sfx;
    bgmBus = ctx.createGain(); bgmBus.gain.value = vol.bgm * 0.55;
    sfxBus.connect(comp); bgmBus.connect(comp); comp.connect(master); master.connect(ctx.destination);
    const len = ctx.sampleRate * 1.0;
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return true;
  }
  function unlock() {
    if (!init()) return;
    if (ctx.state === 'suspended') ctx.resume();
  }
  function setVolume(kind, v) {
    vol[kind] = v;
    if (!ctx) return;
    if (kind === 'sfx') sfxBus.gain.value = v;
    else bgmBus.gain.setTargetAtTime(v * 0.55, ctx.currentTime, 0.05);
  }

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  function tone(o) {
    const t = ctx.currentTime + (o.when || 0);
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = o.type || 'square';
    const f = o.freq || mtof(o.note || 69);
    osc.frequency.setValueAtTime(f, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f * o.slide), t + (o.dur || 0.1));
    if (o.detune) osc.detune.value = o.detune;
    const a = o.attack ?? 0.004, dur = o.dur ?? 0.1, rel = o.release ?? 0.06, v = o.vol ?? 0.2;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + a);
    g.gain.setValueAtTime(v, t + Math.max(a, dur - rel));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = osc;
    if (o.lp) {
      const flt = ctx.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.value = o.lp;

    if (o.fEnd) flt.frequency.exponentialRampToValueAtTime(o.fEnd, t + (o.dur || 0.2));

    const g = ctx.createGain();
    const dur = o.dur || 0.2, v = o.vol ?? 0.3;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + (o.attack ?? 0.003));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    burn() { noise({ f: 1500, fEnd: 600, dur: 0.3, vol: 0.2, q: 0.6 }); for (let i = 0; i < 5; i++) noise({ f: 3000, dur: 0.03, vol: 0.12, q: 3, when: Math.random() * 0.25 }); },
    freeze() { [100, 104, 108].forEach((n, i) => tone({ note: n, type: 'triangle', dur: 0.2, vol: 0.08, when: i * 0.05 })); noise({ f: 8000, dur: 0.3, vol: 0.1, q: 6 }); },

    fire() { noise({ f: 900, fEnd: 300, dur: 0.35, vol: 0.3, q: 0.7 }); tone({ freq: 120, type: 'sine', dur: 0.25, vol: 0.3, slide: 0.5 }); },

    whoosh() { noise({ f: 600, fEnd: 3000, dur: 0.18, vol: 0.12, q: 1.5 }); },
    star() { tone({ note: 88, type: 'square', dur: 0.08, vol: 0.09 }); tone({ note: 95, type: 'square', dur: 0.2, vol: 0.09, when: 0.07 }); tone({ note: 100, type: 'sine', dur: 0.3, vol: 0.07, when: 0.12 }); },
    dice() { for (let i = 0; i < 6; i++) noise({ f: 2500 + Math.random() * 2000, dur: 0.03, vol: 0.15, q: 5, when: i * 0.07 }); },
    slotTick() { tone({ note: 91, type: 'square', dur: 0.02, vol: 0.04 }); },

    flip() { noise({ f: 3000, dur: 0.06, vol: 0.15, q: 2 }); tone({ note: 84, type: 'triangle', dur: 0.06, vol: 0.06 }); },
    rare(level = 1) {

    // ボスラッシュ用：警報・必殺技・覚醒
    siren() {
      for (let i = 0; i < 3; i++) {
        tone({ freq: 620, type: 'sawtooth', dur: 0.32, vol: 0.09, slide: 1.45, when: i * 0.62, lp: 2600 });
        tone({ freq: 900, type: 'sawtooth', dur: 0.3, vol: 0.09, slide: 0.69, when: i * 0.62 + 0.31, lp: 2600 });

    },
    ult() {
      noise({ f: 300, fEnd: 5000, dur: 0.7, vol: 0.25, q: 0.7 });
      tone({ freq: 60, type: 'sawtooth', dur: 0.9, vol: 0.35, slide: 2.2, lp: 900 });
      tone({ freq: 55, type: 'sine', dur: 0.7, vol: 0.8, slide: 0.4, when: 0.7 });
      noise({ f: 1500, fEnd: 100, dur: 0.8, vol: 0.5, filter: 'lowpass', when: 0.7 });
      [50, 53, 57].forEach(n => tone({ note: n, type: 'square', dur: 0.9, vol: 0.06, when: 0.7, lp: 1600 }));
    },
    awaken() {
      for (let i = 0; i < 10; i++) tone({ note: 48 + i * 2, type: 'square', dur: 0.08, vol: 0.06, when: i * 0.07, lp: 2400 });
      tone({ freq: 40, type: 'sine', dur: 1.2, vol: 0.9, slide: 0.5, when: 0.72 });
      noise({ f: 6000, fEnd: 200, dur: 1.2, vol: 0.45, q: 0.5, when: 0.72 });
      [38, 45, 50, 53].forEach(n => tone({ note: n, type: 'sawtooth', dur: 1.3, vol: 0.05, when: 0.72, lp: 1200 }));
    },
    claim() { SFX.coin(); [84, 88, 91, 96].forEach((n, i) => tone({ note: n, type: 'square', dur: 0.06, vol: 0.06, when: 0.08 + i * 0.04 })); },
  };

  function play(name, arg) {
    if (!ctx || vol.sfx <= 0 || Time.headless) return;
    const now = performance.now();
    // 同じ音の連打で音割れしないように間引く
    if (last[name] && now - last[name] < 28) return;
    last[name] = now;
    try { SFX[name] && SFX[name](arg); } catch (e) { /* noop */ }
  }

  /* ---------- BGM シーケンサ ---------- */
  // コード: [ルートmidi, 種類]  m=マイナー M=メジャー
  const CH = { m: [0, 3, 7, 12], M: [0, 4, 7, 12] };
  const TRACKS = {
    home: {
      bpm: 108, chords: [[48, 'M'], [43, 'M'], [45, 'm'], [41, 'M']],
      bass: '1...1.2.1...1.2.', arp: '0.1.2.3.2.1.0.2.', arpType: 'triangle', arpOct: 24, arpVol: 0.05,
      kick: 'x.......x.......', snare: '....x.......x...', hat: '..x...x...x...x.', drumVol: 0.6,
      lead: [72, 0, 76, 79, 0, 76, 72, 0, 71, 0, 74, 79, 0, 74, 71, 0, 69, 0, 72, 76, 0, 79, 76, 72, 77, 0, 76, 72, 0, 69, 72, 0],
      leadType: 'triangle', leadVol: 0.05,
    },
    battle: {
      bpm: 138, chords: [[45, 'm'], [41, 'M'], [48, 'M'], [43, 'M']],
      bass: '1.2.1.2.1.2.1.23', arp: '0123210301232103', arpType: 'square', arpOct: 24, arpVol: 0.028,
      kick: 'x...x...x...x...', snare: '....x.......x..x', hat: '..x...x...x...x.', drumVol: 0.9,
      lead: [76, 0, 81, 0, 79, 76, 0, 74, 72, 0, 77, 0, 76, 72, 0, 69, 67, 0, 72, 76, 79, 0, 76, 72, 74, 0, 71, 74, 79, 0, 83, 0],
      leadType: 'square', leadVol: 0.035,
    },
    boss: {
      bpm: 150, chords: [[38, 'm'], [46, 'M'], [43, 'm'], [45, 'M']],
      bass: '1111211112111213', arp: '0120312003210123', arpType: 'sawtooth', arpOct: 24, arpVol: 0.022,
      kick: 'x..xx...x..xx...', snare: '....x.......x.xx', hat: 'xxxxxxxxxxxxxxxx', drumVol: 1,
      lead: [74, 74, 0, 77, 0, 81, 0, 77, 74, 0, 70, 0, 74, 77, 0, 74, 70, 70, 0, 74, 0, 79, 0, 74, 73, 0, 76, 0, 79, 0, 81, 0],
      leadType: 'square', leadVol: 0.035,
    },
    // ボスラッシュ：低いD#マイナーの重いリフ。覚醒後(rush2)はテンポと密度が上がる
    rush: {
      bpm: 156, chords: [[39, 'm'], [39, 'm'], [35, 'M'], [37, 'M']],
      bass: '1.1.21.11.1.21.3', arp: '0.0.1.0.2.0.1.3.', arpType: 'sawtooth', arpOct: 24, arpVol: 0.02,
      kick: 'x.x...x.x.x...x.', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.xx', drumVol: 1,
      lead: [75, 0, 75, 74, 0, 70, 0, 0, 75, 0, 78, 0, 77, 75, 74, 0, 71, 0, 71, 70, 0, 66, 0, 0, 73, 0, 75, 0, 77, 0, 78, 0],
      leadType: 'sawtooth', leadVol: 0.028,
    },
    rush2: {
      bpm: 178, chords: [[39, 'm'], [42, 'M'], [35, 'M'], [37, 'M']],
      bass: '1111211121112123', arp: '0123012301230123', arpType: 'sawtooth', arpOct: 24, arpVol: 0.022,
      kick: 'x.xxx.x.x.xxx.x.', snare: '....x..x....x.xx', hat: 'xxxxxxxxxxxxxxxx', drumVol: 1.1,
      lead: [87, 0, 86, 0, 82, 0, 87, 90, 0, 89, 87, 86, 0, 82, 0, 0, 83, 0, 82, 0, 78, 0, 83, 87, 0, 85, 83, 82, 85, 0, 87, 0],
      leadType: 'square', leadVol: 0.03,
    },
    fever: {
      bpm: 172, chords: [[47, 'm'], [43, 'M'], [50, 'M'], [45, 'M']],
      bass: '1212121212121223', arp: '0123012301230123', arpType: 'square', arpOct: 24, arpVol: 0.03,
      kick: 'x...x...x...x...', snare: '....x.......x.x.', hat: 'xxxxxxxxxxxxxxxx', drumVol: 1,
      lead: [78, 0, 83, 0, 81, 78, 0, 76, 74, 0, 79, 0, 78, 74, 0, 71, 69, 0, 74, 78, 81, 0, 78, 74, 76, 0, 73, 76, 81, 0, 85, 88],
      leadType: 'square', leadVol: 0.045,
    },
  };

  let cur = null, curName = null, step = 0, nextTime = 0, timer = null;

  function playStep(tr, s, t) {
    const bar = Math.floor(s / 16) % tr.chords.length;
    const i = s % 16;
    const [root, q] = tr.chords[bar];
    const tones = CH[q];
    const stepDur = 60 / tr.bpm / 4;
    const b = tr.bass[i];
    if (b && b !== '.') {
      const off = b === '1' ? 0 : b === '2' ? 12 : 7;
      schedTone(t, { note: root - 12 + off + 12, type: 'triangle', dur: stepDur * 1.6, vol: 0.16 });
    }
    const a = tr.arp[i];
    if (a && a !== '.') {
      schedTone(t, { note: root + tr.arpOct + tones[+a], type: tr.arpType, dur: stepDur * 0.9, vol: tr.arpVol, lp: 4000 });
    }
    if (tr.lead && i % 2 === 0) {
      const li = (bar * 8 + i / 2) % tr.lead.length;
      const n = tr.lead[li];
      if (n) schedTone(t, { note: n, type: tr.leadType, dur: stepDur * 1.8, vol: tr.leadVol, lp: 3500 });
    }
    const dv = tr.drumVol;
    if (tr.kick[i] === 'x') schedKick(t, dv);
    if (tr.snare[i] === 'x') schedNoise(t, { f: 1800, dur: 0.12, vol: 0.12 * dv, q: 0.7 });
    if (tr.hat[i] === 'x') schedNoise(t, { f: 9000, dur: 0.035, vol: 0.05 * dv, q: 1, filter: 'highpass' });
  }
  function schedTone(t, o) { o.when = t - ctx.currentTime; o.dest = bgmBus; if (o.when >= -0.01) tone(o); }
  function schedNoise(t, o) { o.when = t - ctx.currentTime; o.dest = bgmBus; if (o.when >= -0.01) noise(o); }
  function schedKick(t, dv) {
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(150, t); osc.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(0.5 * dv, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    osc.connect(g); g.connect(bgmBus); osc.start(t); osc.stop(t + 0.2);
  }

  function scheduler() {
    if (!cur || !ctx) return;
    const stepDur = 60 / cur.bpm / 4;
    while (nextTime < ctx.currentTime + 0.12) {
      playStep(cur, step, nextTime);
      nextTime += stepDur; step++;
    }
  }

  function bgm(name) {
    if (Time.headless) return;
    if (!init()) return;
    if (name === curName) return;
    curName = name;
    cur = name ? TRACKS[name] : null;
    if (!cur) { clearInterval(timer); timer = null; return; }
    step = 0; nextTime = ctx.currentTime + 0.06;
    if (!timer) timer = setInterval(scheduler, 25);
  }

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else if (curName || vol.sfx) ctx.resume();
  });

  return { unlock, play, bgm, setVolume, get current() { return curName; }, vol };
})();

<script>
'use strict';
/* ===== 演出：パーティクル・ダメージ数字・バナー・シェイク ===== */

const FX = (() => {
  let cv, cx, bg, bx, W = 0, H = 0, dpr = 1;
  const parts = [];
  const amb = [];
  let ambKind = 'none';
  let layer, shakeT = 0, shakeA = 0, shakeEl = null;
  const MAX = 700;

  function init() {
    cv = $('#fx'); cx = cv.getContext('2d');
    bg = $('#bgfx'); bx = bg.getContext('2d');
    layer = $('#fx-text');
    resize();
    addEventListener('resize', resize);
    requestAnimationFrame(loop);
  }
  function resize() {
    dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    for (const c of [cv, bg]) {
      c.width = W * dpr; c.height = H * dpr;
      c.style.width = W + 'px'; c.style.height = H + 'px';
    }
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const scale = () => (Time.reduced ? 0.35 : 1);

  function add(p) {
    if (Time.headless) return;
    if (parts.length >= MAX) parts.shift();
    p.life = p.life ?? 1; p.max = p.life; p.rot = p.rot ?? Math.random() * 6.28; p.vr = p.vr ?? (Math.random() - 0.5) * 0.3;
    p.g = p.g ?? 0; p.drag = p.drag ?? 0.98;
    parts.push(p);
  }

  function burst(x, y, o = {}) {
    const n = Math.round((o.count ?? 24) * scale());
    const colors = o.colors || ['#fff'];
    for (let i = 0; i < n; i++) {
      const a = (o.angle ?? Math.random() * 6.28) + (o.spread != null ? (Math.random() - 0.5) * o.spread : 0);
      const sp = (o.speed ?? 6) * (0.4 + Math.random() * 0.8);
      add({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        size: (o.size ?? 4) * (0.6 + Math.random() * 0.8),
        color: colors[i % colors.length], type: o.type || 'spark',
        life: (o.life ?? 0.7) * (0.6 + Math.random() * 0.6), g: o.gravity ?? 0.15, drag: o.drag ?? 0.95,
      });
    }
  }
  function ring(x, y, o = {}) {
    add({ x, y, vx: 0, vy: 0, type: 'ring', color: o.color || '#fff', size: o.size ?? 10, grow: o.grow ?? 8, life: o.life ?? 0.45, width: o.width ?? 4, g: 0 });
  }
  function rays(x, y, o = {}) {
    add({ x, y, vx: 0, vy: 0, type: 'rays', color: o.color || '#fff', size: o.size ?? 300, life: o.life ?? 1.2, g: 0, vr: 0.01, rot: 0 });
  }
  function confetti(n = 120, o = {}) {
    n = Math.round(n * scale());
    const colors = o.colors || ['#ff3d8b', '#2ee6ff', '#ffcc33', '#8dff4f', '#ffffff'];
    for (let i = 0; i < n; i++) {
      add({
        x: Math.random() * W, y: -20 - Math.random() * H * 0.4,
        vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 4,
        size: 5 + Math.random() * 6, color: colors[i % colors.length], type: 'paper',
        life: 2.5 + Math.random() * 1.5, g: 0.04, drag: 0.995, vr: (Math.random() - 0.5) * 0.4,
      });
    }
  }
  function fountain(x, y, n = 40, colors) {
    n = Math.round(n * scale());
    colors = colors || ['#ffcc33', '#fff3b0', '#ff3d8b', '#2ee6ff'];
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.2;
      const sp = 8 + Math.random() * 9;
      add({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, size: 4 + Math.random() * 5, color: colors[i % colors.length], type: i % 3 ? 'paper' : 'star', life: 1.6, g: 0.3, drag: 0.985 });
    }
  }
  function coins(x, y, n = 12) {
    n = Math.round(n * scale());
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 2;
      const sp = 4 + Math.random() * 7;
      add({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, size: 7, color: '#ffcc33', type: 'coin', life: 1.2, g: 0.35, drag: 0.98 });
    }
  }
  function bolt(x1, y1, x2, y2, color = '#bff8ff') {
    const pts = [];
    const segs = 10;
    for (let i = 0; i <= segs; i++) {
      const t = i / segs;
      const jitter = (i === 0 || i === segs) ? 0 : (Math.random() - 0.5) * 40;
      const nx = -(y2 - y1), ny = x2 - x1, nl = Math.hypot(nx, ny) || 1;
      pts.push([lerp(x1, x2, t) + nx / nl * jitter, lerp(y1, y2, t) + ny / nl * jitter]);
    }
    add({ x: 0, y: 0, vx: 0, vy: 0, type: 'bolt', pts, color, life: 0.28, g: 0, drag: 1 });
  }

  // 発射体（Promiseで着弾を待てる）
  function projectile(x1, y1, x2, y2, o = {}) {
    if (Time.headless) return Promise.resolve();
    const dur = (o.dur ?? 320) / Time.speed;
    const color = o.color || '#fff';
    const kind = o.kind || 'orb';
    if (kind === 'bolt') {
      bolt(x1, y1, x2, y2, color); bolt(x1, y1, x2, y2, '#ffffff');
      return wait(90);
    }
    return new Promise(res => {
      const start = performance.now();
      const arc = o.arc ?? -60;
      const p = { type: 'proj', x: x1, y: y1, vx: 0, vy: 0, color, size: o.size ?? 10, life: 99, g: 0, drag: 1 };
      add(p);
      const step = now => {
        const t = Math.min(1, (now - start) / dur);
        const e = t * t * (3 - 2 * t);
        p.x = lerp(x1, x2, e);
        p.y = lerp(y1, y2, e) + Math.sin(t * Math.PI) * arc;
        if (Math.random() < 0.9 * scale()) add({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5, size: p.size * 0.6, color, type: 'glow', life: 0.3, g: kind === 'fire' ? -0.05 : 0 });
        if (t < 1) requestAnimationFrame(step); else { p.life = 0; res(); }
      };
      requestAnimationFrame(step);
    });
  }

  function loop() {
    requestAnimationFrame(loop);
    cx.clearRect(0, 0, W, H);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= 1 / 60;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      p.vx *= p.drag; p.vy *= p.drag; p.vy += p.g;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      draw(cx, p);
    }
    // 画面シェイク
    if (shakeEl) {
      if (shakeT > 0) {
        shakeT -= 1 / 60;
        const a = shakeA * Math.max(0, shakeT) * 3;
        shakeEl.style.transform = `translate(${(Math.random() - 0.5) * a}px, ${(Math.random() - 0.5) * a}px)`;
      } else if (shakeEl.style.transform) shakeEl.style.transform = '';
    }
    drawAmbient();
  }

  function draw(c, p) {
    const k = p.life / p.max;
    c.globalAlpha = Math.min(1, k * 1.6);
    switch (p.type) {
      case 'spark': {
        c.strokeStyle = p.color; c.lineWidth = p.size * 0.6; c.lineCap = 'round';
        c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * 2.2, p.y - p.vy * 2.2); c.stroke();
        break;
      }
      case 'glow': {
        c.globalCompositeOperation = 'lighter';
        c.fillStyle = p.color; c.beginPath(); c.arc(p.x, p.y, p.size * k, 0, 6.28); c.fill();
        c.globalCompositeOperation = 'source-over';
        break;
      }
      case 'proj': {
        c.globalCompositeOperation = 'lighter';
        const g = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 2);
        g.addColorStop(0, '#fff'); g.addColorStop(0.3, p.color); g.addColorStop(1, 'rgba(0,0,0,0)');
        c.fillStyle = g; c.beginPath(); c.arc(p.x, p.y, p.size * 2, 0, 6.28); c.fill();
        c.globalCompositeOperation = 'source-over';
        break;
      }
      case 'ring': {
        const r = p.size + (1 - k) * p.grow * 12;
        c.strokeStyle = p.color; c.lineWidth = p.width * k + 0.5;
        c.beginPath(); c.arc(p.x, p.y, r, 0, 6.28); c.stroke();
        break;
      }
      case 'rays': {
        c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
        c.globalCompositeOperation = 'lighter';
        c.globalAlpha = Math.min(1, k * 1.5) * 0.35;
        c.fillStyle = p.color;
        for (let i = 0; i < 16; i++) {
          c.rotate(Math.PI / 8);
          c.beginPath(); c.moveTo(0, 0); c.lineTo(p.size, -p.size * 0.08); c.lineTo(p.size, p.size * 0.08); c.closePath(); c.fill();
        }
        c.restore(); c.globalCompositeOperation = 'source-over';
        break;
      }
      case 'paper': {
        c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
        c.fillStyle = p.color; c.fillRect(-p.size / 2, -p.size / 4 * Math.abs(Math.sin(p.rot * 2) + 0.3), p.size, p.size / 2);
        c.restore();
        break;
      }
      case 'star': {
        c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.color;
        c.beginPath();
        for (let i = 0; i < 10; i++) { const r = i % 2 ? p.size * 0.45 : p.size; const a = i * Math.PI / 5; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
        c.closePath(); c.fill(); c.restore();
        break;
      }
      case 'coin': {
        c.save(); c.translate(p.x, p.y);
        const sx = Math.abs(Math.cos(p.rot * 3));
        c.scale(Math.max(0.15, sx), 1);
        c.fillStyle = '#ffcc33'; c.beginPath(); c.arc(0, 0, p.size, 0, 6.28); c.fill();
        c.fillStyle = '#fff6c4'; c.beginPath(); c.arc(-p.size * 0.3, -p.size * 0.3, p.size * 0.35, 0, 6.28); c.fill();
        c.strokeStyle = '#b8860b'; c.lineWidth = 1.5; c.beginPath(); c.arc(0, 0, p.size, 0, 6.28); c.stroke();
        c.restore();
        break;
      }
      case 'shard': {
        c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.color;
        c.beginPath(); c.moveTo(0, -p.size); c.lineTo(p.size * 0.7, p.size * 0.6); c.lineTo(-p.size * 0.6, p.size * 0.4); c.closePath(); c.fill();
        c.restore();
        break;
      }
      case 'bolt': {
        c.globalCompositeOperation = 'lighter';
        c.strokeStyle = p.color; c.lineWidth = 3 + k * 4; c.lineJoin = 'round';
        c.shadowColor = p.color; c.shadowBlur = 16;
        c.beginPath(); p.pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.stroke();
        c.shadowBlur = 0; c.globalCompositeOperation = 'source-over';
        break;
      }
    }
    c.globalAlpha = 1;
  }

  /* ---- 背景のアンビエント粒子（フィールドごと） ---- */
  const AMB = {
    none: { color: ['rgba(180,160,255,.35)'], rate: 0.25, vy: -0.25, size: [1, 2.5] },
    blaze: { color: ['#ff9a3d', '#ff5a36', '#ffd166'], rate: 1.6, vy: -1.2, size: [1.5, 3.5], glow: true },
    storm: { color: ['#bff8ff', '#7fe9ff', '#ffffff'], rate: 1.4, vy: 1.4, vx: -0.6, size: [1, 2.5], flash: true },
    sugar: { color: ['#ff7ac8', '#ffd1ec', '#9ef0ff', '#fff3a0'], rate: 1.0, vy: 0.6, size: [2, 4], paper: true },
    necro: { color: ['rgba(169,120,255,.5)', 'rgba(120,255,200,.35)'], rate: 0.8, vy: -0.35, size: [8, 22], fog: true },
    lucky: { color: ['#ffcc33', '#fff3b0'], rate: 0.6, vy: 1.0, size: [4, 6], coin: true },
    mecha: { color: ['#6dffb3', '#bfffe0'], rate: 0.9, vy: -0.5, size: [1.5, 3], square: true },
    neutral: { color: ['#ffffff', '#ffcc33', '#ff3d8b'], rate: 0.9, vy: -0.6, size: [1.5, 3] },
    fever: { color: ['#ff3d8b', '#ffcc33', '#2ee6ff', '#ffffff'], rate: 3, vy: -2.2, size: [1.5, 4], glow: true },
    risk: { color: ['#ff3a5c', '#b3001e', '#ff8fa3'], rate: 0.9, vy: 1.2, size: [2, 4], glow: true },
  };
  let flashT = 0;
  function setAmbient(kind) { ambKind = AMB[kind] ? kind : 'none'; }
  function drawAmbient() {
    bx.clearRect(0, 0, W, H);
    const a = AMB[ambKind];
    if (a && !Time.headless) {
      const rate = a.rate * (Time.reduced ? 0.3 : 1);
      if (Math.random() < rate % 1 || rate >= 1) {
        const n = Math.max(1, Math.floor(rate));
        for (let i = 0; i < n; i++) {
          if (amb.length > 160) break;
          amb.push({
            x: Math.random() * W, y: a.vy < 0 ? H + 10 : -10,
            vx: (a.vx || 0) + (Math.random() - 0.5) * 0.4, vy: a.vy * (0.6 + Math.random() * 0.8),
            s: a.size[0] + Math.random() * (a.size[1] - a.size[0]), c: a.color[Math.floor(Math.random() * a.color.length)],
            life: 1, r: Math.random() * 6, k: ambKind,
          });
        }
      }
      if (a.flash && !Time.reduced && Math.random() < 0.004) flashT = 1;
    }
    for (let i = amb.length - 1; i >= 0; i--) {
      const p = amb[i];
      p.x += p.vx; p.y += p.vy; p.r += 0.02;
      if (p.y < -40 || p.y > H + 40 || p.k !== ambKind) { p.life -= 0.05; if (p.life <= 0 || p.y < -40 || p.y > H + 40) { amb.splice(i, 1); continue; } }
      const s = AMB[p.k] || AMB.none;
      bx.globalAlpha = 0.7 * p.life;
      bx.fillStyle = p.c;
      if (s.fog) {
        const g = bx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.s * 3);
        g.addColorStop(0, p.c); g.addColorStop(1, 'rgba(0,0,0,0)');
        bx.fillStyle = g; bx.beginPath(); bx.arc(p.x, p.y, p.s * 3, 0, 6.28); bx.fill();
      } else if (s.paper) {
        bx.save(); bx.translate(p.x + Math.sin(p.r) * 8, p.y); bx.rotate(p.r); bx.fillRect(-p.s, -p.s / 3, p.s * 2, p.s * 0.7); bx.restore();
      } else if (s.coin) {
        bx.save(); bx.translate(p.x, p.y); bx.scale(Math.max(0.2, Math.abs(Math.cos(p.r * 2))), 1);
        bx.beginPath(); bx.arc(0, 0, p.s, 0, 6.28); bx.fill(); bx.restore();
      } else if (s.square) {
        bx.save(); bx.translate(p.x, p.y); bx.rotate(p.r); bx.strokeStyle = p.c; bx.lineWidth = 1; bx.strokeRect(-p.s * 1.5, -p.s * 1.5, p.s * 3, p.s * 3); bx.restore();
      } else {
        if (s.glow) { bx.shadowColor = p.c; bx.shadowBlur = 8; }
        bx.beginPath(); bx.arc(p.x + Math.sin(p.r) * 3, p.y, p.s, 0, 6.28); bx.fill();
        bx.shadowBlur = 0;
      }
    }
    if (flashT > 0) {
      bx.globalAlpha = flashT * 0.18; bx.fillStyle = '#dff9ff'; bx.fillRect(0, 0, W, H);
      flashT -= 0.08;
    }
    bx.globalAlpha = 1;
  }

  /* ---- DOM演出 ---- */
  function popText(x, y, text, cls = '', o = {}) {
    if (Time.headless) return;
    const e = el('div', 'pop ' + cls, text);
    e.style.left = x + 'px'; e.style.top = y + 'px';
    if (o.color) e.style.setProperty('--c', o.color);
    if (o.size) e.style.fontSize = o.size + 'px';
    layer.appendChild(e);
    const dur = (o.dur ?? 900) / Math.min(Time.speed, 2);
    const dx = o.dx ?? (Math.random() - 0.5) * 30;
    e.animate([
      { transform: 'translate(-50%,-50%) scale(.3)', opacity: 0 },
      { transform: `translate(calc(-50% + ${dx * 0.4}px),-90%) scale(${o.peak ?? 1.35})`, opacity: 1, offset: 0.18 },
      { transform: `translate(calc(-50% + ${dx * 0.7}px),-110%) scale(1)`, opacity: 1, offset: 0.6 },
      { transform: `translate(calc(-50% + ${dx}px),-190%) scale(.9)`, opacity: 0 },
    ], { duration: dur, easing: 'cubic-bezier(.2,.8,.3,1)' }).finished.then(() => e.remove(), () => e.remove());
  }

  // 画面中央のでかい文字
  function banner(text, o = {}) {
    if (Time.headless) return Promise.resolve();
    const e = el('div', 'banner ' + (o.cls || ''), `<div class="banner-main">${text}</div>${o.sub ? `<div class="banner-sub">${o.sub}</div>` : ''}`);
    if (o.color) e.style.setProperty('--c', o.color);
    if (o.y != null) e.style.top = o.y;
    layer.appendChild(e);
    const dur = (o.dur ?? 1100) / Math.min(Time.speed, 2.5);
    const a = e.animate([
      { transform: 'translate(-50%,-50%) scale(2.6) rotate(-4deg)', opacity: 0, filter: 'blur(6px)' },
      { transform: 'translate(-50%,-50%) scale(.92) rotate(-4deg)', opacity: 1, filter: 'blur(0)', offset: 0.14 },
      { transform: 'translate(-50%,-50%) scale(1.04) rotate(-4deg)', opacity: 1, offset: 0.22 },
      { transform: 'translate(-50%,-50%) scale(1) rotate(-4deg)', opacity: 1, offset: 0.8 },
      { transform: 'translate(-50%,-50%) scale(1.15) rotate(-4deg)', opacity: 0 },
    ], { duration: dur, easing: 'ease-out' });
    return a.finished.then(() => e.remove(), () => e.remove());
  }

  // 「えぐっ!!」みたいなリアクション文字（斜めに飛び込む）
  function react(text, color) {
    if (Time.headless) return;
    const e = el('div', 'react', text);
    if (color) e.style.setProperty('--c', color);
    const left = Math.random() < 0.5;
    e.style.left = left ? '6%' : 'auto';
    e.style.right = left ? 'auto' : '6%';
    e.style.top = (28 + Math.random() * 30) + '%';
    layer.appendChild(e);
    const rot = left ? -12 : 12;
    e.animate([
      { transform: `translateX(${left ? -80 : 80}px) rotate(${rot}deg) scale(.4)`, opacity: 0 },
      { transform: `translateX(0) rotate(${rot}deg) scale(1.2)`, opacity: 1, offset: 0.15 },
      { transform: `translateX(0) rotate(${rot}deg) scale(1)`, opacity: 1, offset: 0.7 },
      { transform: `translateY(-30px) rotate(${rot}deg) scale(1)`, opacity: 0 },
    ], { duration: 1000, easing: 'ease-out' }).finished.then(() => e.remove(), () => e.remove());
  }

  function shake(level = 1, target) {
    if (Time.headless || Time.reduced) return;
    shakeEl = target || $('#scr-battle .battle-stage') || document.body;
    shakeA = Math.max(shakeA * (shakeT > 0 ? 1 : 0), 4 + level * 5);
    shakeT = Math.max(shakeT, 0.18 + level * 0.06);
  }

  function flash(color = '#fff', alpha = 0.35, dur = 180) {
    if (Time.headless || Time.reduced) return;
    const e = el('div', 'flash');
    e.style.background = color;
    layer.appendChild(e);
    e.animate([{ opacity: alpha }, { opacity: 0 }], { duration: dur }).finished.then(() => e.remove(), () => e.remove());
  }

  function toast(html, o = {}) {
    const root = $('#toasts');
    if (!root || Time.headless) return;
    const e = el('div', 'toast ' + (o.cls || ''), html);
    root.appendChild(e);
    setTimeout(() => { e.classList.add('out'); setTimeout(() => e.remove(), 400); }, o.dur ?? 2600);
  }

  return { init, burst, ring, rays, confetti, fountain, coins, bolt, projectile, popText, banner, react, shake, flash, toast, setAmbient, add };
})();

</script>

  { id: 'tk_bone', name: 'ホネホネ', emoji: '🦴', tribe: 'necro', rarity: 'N', type: 'unit', cost: 1, atk: 10, hp: 10, token: true, text: 'カタカタ。', flavor: true },

  { id: 'tk_balloon', name: '風船', emoji: '🎈', tribe: 'toy', rarity: 'N', type: 'unit', cost: 1, atk: 10, hp: 10, kw: ['fly'], token: true, text: '' },

];

const CARDS = {};
CARD_LIST.forEach(c => { c.kw = c.kw || []; CARDS[c.id] = c; });
const COLLECTIBLE = CARD_LIST.filter(c => !c.token);

// カードの説明文（キーワード込み）
function cardRulesText(def) {
  const parts = [];
  if (def.hpCost && !/HPコスト/.test(def.text)) parts.push(`HPコスト${def.hpCost}`);
  if (def.kw && def.kw.length) parts.push(def.kw.map(k => KW[k].name).join('・'));
  if (def.text && !def.flavor) parts.push(def.text);
  return parts.join('\n');
}
function typeLabel(def) {
  return def.type === 'unit' ? 'ユニット' : def.type === 'spell' ? 'スペル' : 'フィールド';
}

<script>
'use strict';
/* ===== カードの見た目 ===== */

const KW_ORDER = ['intercept', 'guard', 'armor', 'shield', 'double', 'pierce', 'fly', 'chain', 'thorns', 'drain', 'lucky', 'regen', 'undying', 'poison', 'burnhit', 'freezehit', 'warp'];

// 手札・ギャラリー用のカード
function cardEl(def, o = {}) {
  const t = TRIBES[def.tribe];
  const e = el('div', `card t-${def.tribe} r-${def.rarity} ty-${def.type} ${o.cls || ''}`);
  e.style.setProperty('--tc', t.color);
  e.style.setProperty('--rc', RARITY[def.rarity].color);
  if (o.locked) {
    e.classList.add('locked');
    e.innerHTML = `<div class="card-in"><div class="card-art"><span class="card-emoji">？</span></div><div class="card-rar">${def.rarity}</div><div class="card-name">？？？</div></div>`;
    return e;
  }
  const kws = def.kw.slice().sort((a, b) => KW_ORDER.indexOf(a) - KW_ORDER.indexOf(b));
  const stats = def.type === 'unit'
    ? `<div class="card-atk"><b>${def.atkText || def.atk}</b></div><div class="card-hp"><b>${def.hp}</b></div>`
    : `<div class="card-type">${def.type === 'spell' ? 'SPELL' : 'FIELD'}</div>`;
  const text = o.text ? `<div class="card-text">${esc(cardRulesText(def) || def.text).replace(/\n/g, '<br>')}</div>` : '';
  e.innerHTML = `
    <div class="card-in">
      <div class="card-art"><div class="card-burst"></div><span class="card-emoji">${def.emoji}</span></div>
      <div class="card-cost"><b>${o.cost ?? def.cost}</b></div>
      ${def.hpCost ? `<div class="card-hpcost">♥${def.hpCost}</div>` : ''}
      ${def.countdown ? `<div class="card-count-badge">⏳${def.countdown}</div>` : ''}
      <div class="card-rar">${def.rarity}</div>
      ${kws.length ? `<div class="card-kw">${kws.map(k => `<i title="${KW[k].name}">${KW[k].icon}</i>`).join('')}</div>` : ''}
      <div class="card-name">${esc(def.name)}</div>
      ${text}
      ${stats}
    </div>`;
  if (o.count != null) e.appendChild(el('div', 'card-count', '×' + o.count));
  if (o.isNew) e.appendChild(el('div', 'card-new', 'NEW'));
  return e;
}

// 盤面のユニット
function unitEl(u) {
  const def = u.def, t = TRIBES[def.tribe];
  const e = el('div', `unit t-${def.tribe} r-${def.rarity}`);
  e.dataset.uid = u.uid;
  e.style.setProperty('--tc', t.color);
  e.style.setProperty('--rc', RARITY[def.rarity].color);
  e.innerHTML = `
    <div class="unit-in">
      <div class="card-art"><div class="card-burst"></div><span class="card-emoji">${def.emoji}</span></div>
      <div class="u-stars"></div>
      <div class="u-kw"></div>
      <div class="u-status"></div>
      <div class="card-atk"><b></b></div><div class="card-hp"><b></b></div>
    </div>
    <div class="u-shield"></div>
    <div class="u-ice"></div>`;
  updateUnitEl(e, u);
  return e;
}

function updateUnitEl(e, u) {
  const atk = B.atkOf(u);
  const atkB = e.querySelector('.card-atk b'), hpB = e.querySelector('.card-hp b');
  if (atkB.textContent !== String(atk)) atkB.textContent = atk;
  if (hpB.textContent !== String(Math.max(0, u.hp))) hpB.textContent = Math.max(0, u.hp);
  e.querySelector('.card-atk').classList.toggle('up', atk > u.def.atk * u.star);
  e.querySelector('.card-hp').classList.toggle('hurt', u.hp < u.maxHp);
  e.querySelector('.card-hp').classList.toggle('up', u.hp >= u.maxHp && u.maxHp > u.def.hp * u.star);
  const stars = u.star > 1 ? '★'.repeat(u.star) : '';
  const st = e.querySelector('.u-stars');
  if (st.textContent !== stars) st.textContent = stars;
  e.classList.toggle('star2', u.star === 2);
  e.classList.toggle('star3', u.star === 3);
  const kws = B.kwList(u).sort((a, b) => KW_ORDER.indexOf(a) - KW_ORDER.indexOf(b)).map(k => KW[k].icon).join('');
  const kwEl = e.querySelector('.u-kw');
  if (kwEl.textContent !== kws) kwEl.textContent = kws;
  const status = (u.count > 0 ? `<span class="st-count">⏳${u.count}</span>` : '') + (u.burn > 0 ? `<span class="st-burn">🔥${u.burn}</span>` : '') + (u.frozen ? '<span class="st-ice">❄️</span>' : '');
  const se = e.querySelector('.u-status');
  if (se.innerHTML !== status) se.innerHTML = status;
  e.classList.toggle('shielded', !!u.shield);
  e.classList.toggle('frozen', !!u.frozen);
  e.classList.toggle('burning', u.burn > 0);
  e.classList.toggle('lowhp', u.hp > 0 && u.hp <= u.maxHp * 0.34);
}

// 詳細テキスト（ヒント帯・プレビュー用）
function detailHTML(def, u) {
  const t = TRIBES[def.tribe];
  const kws = (u ? B.kwList(u) : def.kw).filter(k => KW[k]);
  let head = `<span class="dt-rar" style="--rc:${RARITY[def.rarity].color}">${def.rarity}</span><span class="dt-name">${esc(def.name)}</span><span class="dt-tribe" style="--tc:${t.color}">${t.icon}${t.name}・${typeLabel(def)}</span>`;
  if (u && u.star > 1) head += `<span class="dt-star">${'★'.repeat(u.star)}</span>`;
  let body = '';
  if (def.text && !def.flavor) body += `<div class="dt-text">${esc(def.text)}</div>`;
  if (kws.length) body += `<div class="dt-kws">${kws.map(k => `<span><b>${KW[k].icon}${KW[k].name}</b> ${KW[k].desc}</span>`).join('')}</div>`;
  if (u) {
    const st = [];
    if (u.shield) st.push(`<span><b>${KW.shield.icon}シールド</b> ${KW.shield.desc}</span>`);
    if (u.burn > 0) st.push(`<span><b>🔥炎上${u.burn}</b> ${STATUS_INFO.burn.replace(/^.+?：/, '')}</span>`);
    if (u.frozen) st.push(`<span><b>❄️凍結</b> ${STATUS_INFO.frozen.replace(/^.+?：/, '')}</span>`);
    if (u.count > 0) st.push(`<span><b>⏳あと${u.count}ターン</b> ${STATUS_INFO.count.replace(/^.+?：/, '')}</span>`);
    if (u.def.atkMod && u.def.atkMod(B, u) > 0) st.push(`<span><b>⚔今ATK+${u.def.atkMod(B, u)}</b> 条件を満たしている！</span>`);
    if (st.length) body += `<div class="dt-kws">${st.join('')}</div>`;
  }
  if (!u && def.countdown) body += `<div class="dt-kws"><span><b>⏳カウント</b> ${STATUS_INFO.count.replace(/^.+?：/, '')}</span></div>`;
  if (def.onPreAttack) body += `<div class="dt-kws"><span><b>⚡アタック前</b> ${STATUS_INFO.preAttack.replace(/^.+?：/, '')}</span></div>`;
  if (def.hpCost) body += `<div class="dt-kws"><span><b>♥HPコスト</b> ${STATUS_INFO.hpCost.replace(/^.+?：/, '')}</span></div>`;
  if (!body) body = `<div class="dt-text dt-flavor">${esc(def.text || '特殊効果なし')}</div>`;
  return `<div class="dt-head">${head}</div>${body}`;
}

// 長押しプレビュー
const Preview = {
  elm: null,
  show(def, u) {
    this.hide();
    const wrap = el('div', 'preview');
    const c = cardEl(def, { cls: 'big' });
    if (u) {
      const a = c.querySelector('.card-atk b'), h = c.querySelector('.card-hp b');
      if (a) a.textContent = B.atkOf(u);
      if (h) h.textContent = u.hp;
    }
    wrap.appendChild(c);
    const info = el('div', 'preview-info', detailHTML(def, u));
    wrap.appendChild(info);
    document.body.appendChild(wrap);
    this.elm = wrap;
    wrap.addEventListener('pointerdown', () => this.hide());
    animate(c, [{ transform: 'scale(.7) rotateY(30deg)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 220, easing: 'cubic-bezier(.2,1.4,.4,1)', realtime: true });
  },
  hide() { if (this.elm) { this.elm.remove(); this.elm = null; } },
};

// 長押し判定ユーティリティ
function onLongPress(target, fn, ms = 420) {
  let timer = null, sx = 0, sy = 0, fired = false;
  target.addEventListener('pointerdown', ev => {
    fired = false; sx = ev.clientX; sy = ev.clientY;
    clearTimeout(timer);
    timer = setTimeout(() => { fired = true; fn(ev); }, ms);
  });
  const cancel = () => clearTimeout(timer);
  target.addEventListener('pointermove', ev => { if (Math.hypot(ev.clientX - sx, ev.clientY - sy) > 10) cancel(); });
  target.addEventListener('pointerup', () => { cancel(); if (fired) setTimeout(() => Preview.hide(), 0); });
  target.addEventListener('pointercancel', cancel);
  target.addEventListener('pointerleave', cancel);
  target.addEventListener('contextmenu', ev => ev.preventDefault());
  return () => fired;
}
